<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Grupo Rosa Choque{% endblock %}</title>

    <!-- Bootstrap: Deixa o design bonito e adaptável para celular -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      /* Cor personalizada para a ONG */
      .bg-rosachoque {
        background-color: #e6005c !important;
      }
      .text-rosachoque {
        color: #e6005c !important;
      }
      .btn-rosachoque {
        background-color: #e6005c;
        color: white;
        border: none;
      }
      .btn-rosachoque:hover {
        background-color: #cc0052;
        color: white;
      }
      .btn-outline-rosachoque {
        color: #e91e63;
        border-color: #e91e63;
        background-color: transparent;
      }
      .btn-outline-rosachoque:hover {
        color: #ffffff;
        background-color: #e91e63;
        border-color: #e91e63;
      }
    </style>
  </head>
  <body class="bg-light">
    <!-- Menu de Navegação Superior -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-rosachoque mb-4 shadow-sm"
    >
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">ONG GRUPO ROSA CHOQUE</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link text-white" href="{% url 'pagina_inicial' %}"
                >Início</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="{% url 'lista_assistidas' %}"
                >Atendidas</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="{% url 'nova_assistida' %}"
                >Nova Atendida</a
              >
            </li>
            {% if user.is_staff %}
            <li class="nav-item ms-md-3">
              <a
                class="nav-link text-warning fw-bold"
                href="{% url 'gestao_equipe' %}"
                >Equipe</a
              >
            </li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>

    <!-- ÁREA MÁGICA: Aqui é onde o conteúdo das outras telas vai aparecer -->
    <div class="container">{% block content %} {% endblock %}</div>

    <!-- Rodapé -->
    <footer class="text-center text-muted mt-5 mb-4">
      <small>&copy; 2026 ONG Grupo Rosa Choque - Sistema de Atendimentos</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
